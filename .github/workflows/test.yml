name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.15.0]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm test
      # `npm run build` is deliberately absent: webpack 4 cannot run on Node 24
      # (css-loader 5 requires postcss/package.json, which the package `exports`
      # map blocks). Phase 3 of UPGRADE_PLAN.md restores the build and this step.
