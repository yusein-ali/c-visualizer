<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>c-visualizer</title>
  </head>
  <body>
    <!--
      An embedding page configures c-visualizer here, with the same options the
      constructor takes, as JSON on the `config` attribute. README's "Embedding
      API" lists the fields. Everything is optional, so the standalone page
      leaves the element out and opens as c-visualizer comes:

      <div
        id="c-visualizer-config"
        config='{"theme": "dark", "features": {"preprocessor": false}}'
      ></div>
    -->
    <div id="root"></div>
  </body>
</html>
