<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>c-visualizer - two instances</title>
		<style>
			/*
       * Only this page's frame. The instances bring their own styles, and this
       * deliberately defines none of the `--plivet-*` variables: what is being
       * checked is two c-visualizer instances, not a host palette.
       */
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
			}

			.pair {
				display: flex;
				flex-wrap: wrap;
				align-items: flex-start;
			}

			/*
       * Side by side where the window has room for two instances of 720px,
       * one above the other where it has not. Each instance lays itself out
       * against its pane, so a window narrower than 720px shows both stacked
       * (editor, console, canvas in one column) and a wider one shows both in
       * two columns: resize the window to watch them switch.
       */
			.pane {
				flex: 1 1 720px;
				min-width: 0;
			}

			.pane h1 {
				margin: 0;
				padding: 6px 10px;
				background: #222;
				color: #fff;
				font-size: 14px;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<div class="pair">
			<div class="pane">
				<h1>A - light, counting up</h1>
				<div id="a"></div>
			</div>
			<div class="pane">
				<h1>B - dark, counting down</h1>
				<div id="b"></div>
			</div>
		</div>
	</body>
</html>
